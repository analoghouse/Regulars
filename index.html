<!-- ══════════════════════════════════════════════════════════════════════
     ANALOG HOUSE — SCHEDULE PAGE
     To update monthly, edit ONLY the SCHEDULE block just below this
     comment. Nothing else in the file needs to change.
     ══════════════════════════════════════════════════════════════════ -->

<style>
  :root{
    --cream:#F2F0EA;
    --cream-2:#E9E6DD;
    --rust:#9A4B2A;
    --rust-tint:rgba(154,75,42,.09);
    --olive:#6F7037;
    --ink:#2B2A26;
    --muted:#8B8578;
    --line:rgba(43,42,38,.14);
    --radius:2px;
    --shadow:0 1px 0 rgba(43,42,38,.06);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-weight:400;
    line-height:1.5;
    /* subtle halftone texture, matching the flyers */
    background-image:radial-gradient(rgba(43,42,38,.055) 1px, transparent 1px);
    background-size:9px 9px;
  }

  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* ── Top bar ─────────────────────────────────────────── */
  .topbar{
    background:var(--rust);
    color:#fff;
    text-align:center;
    font-weight:700;
    font-size:.78rem;
    letter-spacing:.22em;
    padding:11px 20px;
    text-transform:uppercase;
  }

  /* ── Masthead ────────────────────────────────────────── */
  .masthead{padding:30px 0 4px;text-align:center}
  .logo{display:inline-block;text-decoration:none;color:inherit}
  .logo img{height:118px;width:auto;display:block;margin:0 auto}
  @media (max-width:620px){ .logo img{height:92px} }

  /* ── Hero ────────────────────────────────────────────── */
  .hero{padding:30px 0 26px;text-align:center;border-bottom:1px solid var(--line)}
  .eyebrow{
    color:var(--olive);font-weight:600;font-size:.95rem;
    letter-spacing:.01em;margin:0 0 6px;
  }
  h1{
    font-family:'Oswald',sans-serif;font-weight:700;
    text-transform:uppercase;color:var(--rust);
    font-size:clamp(2.6rem,10vw,5.6rem);
    line-height:.9;letter-spacing:.005em;margin:0;
  }
  .month{
    display:inline-block;margin-top:16px;
    border:1.5px solid var(--rust);color:var(--rust);
    font-weight:600;font-size:.78rem;letter-spacing:.18em;
    text-transform:uppercase;padding:6px 16px;border-radius:100px;
  }

  /* ── Live strip (signature element) ──────────────────── */
  .live{
    margin:22px 0 0;padding:16px 20px;
    background:var(--rust);color:#fff;border-radius:var(--radius);
    display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;
    justify-content:center;text-align:center;
  }
  .live-label{
    font-size:.62rem;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;opacity:.78;
  }
  .live-body{font-size:1rem;font-weight:500}
  .live-body strong{
    font-family:'Oswald',sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.03em;font-size:1.18rem;
  }
  .live.quiet{background:var(--olive)}

  /* ── Controls ────────────────────────────────────────── */
  .controls{
    display:flex;flex-wrap:wrap;gap:16px;
    align-items:center;justify-content:space-between;
    padding:26px 0 20px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    font-family:'Poppins',sans-serif;font-size:.76rem;font-weight:600;
    letter-spacing:.09em;text-transform:uppercase;
    background:transparent;color:var(--ink);
    border:1.5px solid var(--line);border-radius:100px;
    padding:7px 15px;cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .chip:hover{border-color:var(--rust);color:var(--rust)}
  .chip[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:#fff}
  .chip.is-today::after{
    content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--olive);margin-left:7px;vertical-align:middle;
  }
  .chip[aria-pressed="true"].is-today::after{background:#fff}

  .toggle{display:flex;border:1.5px solid var(--line);border-radius:100px;overflow:hidden}
  .toggle button{
    font-family:'Poppins',sans-serif;font-size:.74rem;font-weight:600;
    letter-spacing:.09em;text-transform:uppercase;
    background:transparent;border:0;color:var(--muted);
    padding:8px 16px;cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .toggle button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}

  /* ── Day grid ────────────────────────────────────────── */
  .grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;margin-bottom:44px;
  }
  .col{background:var(--cream);display:flex;flex-direction:column;min-height:120px}
  .col-head{
    padding:13px 12px;border-bottom:1px solid var(--line);
    background:var(--cream-2);
  }
  .col-day{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:1.02rem;
    text-transform:uppercase;letter-spacing:.09em;color:var(--ink);line-height:1;
  }
  .col-count{font-size:.66rem;color:var(--muted);letter-spacing:.11em;text-transform:uppercase;margin-top:5px}
  .col.today .col-head{background:var(--rust)}
  .col.today .col-day,.col.today .col-count{color:#fff}
  .col.today .col-count{opacity:.8}

  .slot{padding:14px 12px;border-bottom:1px solid var(--line);position:relative}
  .slot:last-child{border-bottom:0}
  .slot.now{background:var(--rust-tint)}
  .slot.now::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rust);
  }
  .slot-time{
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:clamp(.78rem,.95vw,.9rem);
    color:var(--rust);letter-spacing:.02em;line-height:1.2;white-space:nowrap;
  }
  .slot-name{
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:clamp(.92rem,1.22vw,1.14rem);line-height:1.05;text-transform:uppercase;
    color:var(--ink);margin-top:5px;letter-spacing:.01em;
    overflow-wrap:anywhere;hyphens:auto;
  }
  .slot-with{font-size:.74rem;color:var(--muted);margin-top:4px;line-height:1.35;overflow-wrap:anywhere}
  .slot-note{
    display:inline-block;margin-top:7px;font-size:.6rem;font-weight:600;
    letter-spacing:.13em;text-transform:uppercase;color:var(--olive);
    border:1px solid rgba(111,112,55,.45);border-radius:100px;padding:2px 8px;
  }
  .col-empty{padding:20px 12px;color:var(--muted);font-size:.78rem;font-style:italic}
  .col-empty-weekend{
    color:var(--olive);font-style:normal;font-weight:600;
    font-size:.8rem;line-height:1.4;
  }

  /* ── Class list view (primary) ───────────────────────── */
  .list{margin-bottom:44px}
  .section-head{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:.86rem;
    letter-spacing:.24em;text-transform:uppercase;color:var(--olive);
    margin:38px 0 0;padding-bottom:10px;border-bottom:2px solid var(--olive);
    display:flex;align-items:baseline;justify-content:space-between;
  }
  .section-head:first-child{margin-top:0}
  .section-head span{font-size:.72rem;letter-spacing:.14em;opacity:.65;font-weight:500}

  .card{
    display:grid;grid-template-columns:1fr auto;gap:14px 32px;
    align-items:center;padding:20px 0;border-bottom:1px solid var(--line);
  }
  .card-name{
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:clamp(1.5rem,5vw,2.1rem);line-height:1;
    text-transform:uppercase;color:var(--rust);letter-spacing:.015em;margin:0;
  }
  .card-with{font-size:.85rem;color:var(--muted);margin-top:7px}
  .card-runs{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
  .run{display:flex;align-items:center;gap:12px}
  .run-time{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:1.05rem;
    color:var(--ink);letter-spacing:.02em;white-space:nowrap;
  }
  .run-days{display:flex;gap:4px}
  .pill{
    font-size:.62rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);border-radius:100px;
    padding:3px 8px;line-height:1.35;
  }
  .pill-today{border-color:var(--olive);color:var(--olive);background:rgba(111,112,55,.09)}
  .pill-now{background:var(--rust);border-color:var(--rust);color:#fff}

  .empty{
    padding:56px 20px;text-align:center;color:var(--muted);
    border:1px dashed var(--line);border-radius:var(--radius);margin-bottom:44px;
  }

  /* ── One-off dated events ────────────────────────────── */
  .events{margin:0 0 48px}
  .events-head{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:.86rem;
    letter-spacing:.24em;text-transform:uppercase;color:var(--olive);
    margin:0 0 4px;padding-bottom:10px;border-bottom:2px solid var(--olive);
  }
  .events-head span{opacity:.6;letter-spacing:.14em}
  .event{
    display:grid;grid-template-columns:auto 1fr;gap:18px;
    align-items:center;padding:18px 0;border-bottom:1px solid var(--line);
  }
  .event-date{
    text-align:center;min-width:62px;border:1.5px solid var(--line);
    border-radius:var(--radius);padding:7px 8px;line-height:1;
  }
  .event-day{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:1.5rem;
    color:var(--ink);display:block;
  }
  .event-mon{
    font-size:.6rem;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);display:block;margin-top:4px;
  }
  .event-wd{
    font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);display:block;margin-top:3px;opacity:.8;
  }
  .event-name{
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:clamp(1.25rem,4vw,1.6rem);line-height:1;
    text-transform:uppercase;color:var(--rust);letter-spacing:.015em;margin:0;
  }
  .event-sub{font-size:.88rem;color:var(--ink);margin-top:6px}
  .event-time{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:1rem;
    color:var(--ink);letter-spacing:.02em;margin-top:6px;
  }
  .event-ig{
    color:var(--olive);text-decoration:none;font-size:.82rem;
    border-bottom:1px solid rgba(111,112,55,.35);
  }
  .event-ig:hover,.event-ig:focus-visible{border-bottom-color:var(--olive)}
  .event.flag .event-time{color:var(--rust)}
  .event.past .event-time{color:var(--muted)}
  .event-brand{
    font-size:.6rem;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--olive);margin-bottom:6px;
  }
  .brand-ig{
    color:var(--olive);text-decoration:none;text-transform:none;
    letter-spacing:.01em;font-weight:500;
    border-bottom:1px solid rgba(111,112,55,.4);margin-left:2px;
  }
  .brand-ig:hover,.brand-ig:focus-visible{border-bottom-color:var(--olive)}
  .slot-brand{
    font-size:.56rem;font-weight:600;letter-spacing:.15em;
    text-transform:uppercase;color:var(--olive);margin-top:5px;
  }
  .event-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

  .event.flag .event-date{background:var(--rust);border-color:var(--rust)}
  .event.flag .event-day{color:#fff}
  .event.flag .event-mon,.event.flag .event-wd{color:rgba(255,255,255,.82)}

  .event.past{opacity:.42}
  .event.past .event-name{color:var(--muted)}

  .event.today .event-date{border-color:var(--olive);background:rgba(111,112,55,.1)}

  .tag-today{
    display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.13em;
    text-transform:uppercase;background:var(--olive);color:#fff;
    border-radius:100px;padding:3px 9px;
  }

  /* A class whose slot is reserved but unnamed */
  .card.tba .card-name,.slot.tba .slot-name{color:var(--muted)}
  .card.tba,.slot.tba{opacity:.75}

  /* ── Booking ─────────────────────────────────────────── */
  .booking{
    border-top:1px solid var(--line);padding:44px 0 12px;text-align:center;
  }
  .booking h2{
    font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
    color:var(--rust);font-size:clamp(1.7rem,6vw,2.6rem);
    letter-spacing:.02em;margin:0 0 8px;line-height:1;
  }
  .booking p{color:var(--olive);font-weight:600;letter-spacing:.05em;margin:0 0 26px;text-transform:uppercase;font-size:.85rem}
  .calls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .call{
    display:inline-flex;align-items:center;gap:10px;
    text-decoration:none;color:var(--ink);
    border:1.5px solid var(--ink);border-radius:100px;
    padding:11px 22px;font-weight:500;font-size:1rem;
    transition:background .15s ease,color .15s ease;
  }
  .call:hover,.call:focus-visible{background:var(--ink);color:var(--cream)}
  .call svg{width:16px;height:16px;flex:none}
  .updated{color:var(--muted);font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;margin:34px 0 0}

  .addressbar{
    background:var(--rust);color:#fff;margin-top:26px;
    padding:15px 20px;text-align:center;
    font-size:.82rem;font-weight:500;letter-spacing:.045em;
  }
  .addressbar a{color:#fff;text-decoration:underline;text-underline-offset:3px}

  /* ── A11y & motion ───────────────────────────────────── */
  :focus-visible{outline:2.5px solid var(--olive);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ── Responsive ──────────────────────────────────────── */
  @media (max-width:1040px){
    .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @media (max-width:820px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:1fr;gap:0}
    .col{min-height:0}
    .col + .col{border-top:1px solid var(--line)}
    .controls{flex-direction:column;align-items:stretch;gap:14px}
    .toggle{align-self:flex-start}
    .card{grid-template-columns:1fr;align-items:start}
    .card-runs{align-items:flex-start}
    .live{flex-direction:column;gap:4px}
  }

  /* ── Print ───────────────────────────────────────────── */
  @media print{
    body{background:#fff;background-image:none}
    .controls,.live,.topbar,.call{display:none!important}
    .grid{break-inside:avoid}
    a[href]::after{content:""}
  }
</style>

<script>


/* ── Engine ─────────────────────────────────────────────────────── */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const FULL = { Mon:"Monday", Tue:"Tuesday", Wed:"Wednesday", Thu:"Thursday", Fri:"Friday", Sat:"Saturday", Sun:"Sunday" };

const mins = t => { const [h,m] = t.split(":").map(Number); return h*60 + m; };

const fmt = t => {
  const [h,m] = t.split(":").map(Number);
  const suffix = h < 12 ? "am" : "pm";
  const hr = h % 12 === 0 ? 12 : h % 12;
  return m ? `${hr}:${String(m).padStart(2,"0")}${suffix}` : `${hr}${suffix}`;
};
const range = (s,e) => `${fmt(s)}–${fmt(e)}`;

/* Sort keys: a class sits where its earliest day in the week falls,
   and classes sharing that day are ordered by start time. */
const firstDay   = c => Math.min(...c.sessions.flatMap(s => s.days.map(d => DAYS.indexOf(d))));
const firstStart = c => Math.min(...c.sessions.map(s => mins(s.start)));
const byWeek     = (a,b) => (firstDay(a) - firstDay(b)) || (firstStart(a) - firstStart(b));

/* Group consecutive days: Mon,Tue,Wed,Thu,Fri → "Mon to Fri" */
function dayLabel(days){
  const idx = days.map(d => DAYS.indexOf(d)).sort((a,b)=>a-b);
  if (idx.length >= 3 && idx[idx.length-1] - idx[0] === idx.length - 1)
    return `${DAYS[idx[0]]} to ${DAYS[idx[idx.length-1]]}`;
  return idx.map(i => DAYS[i]).join(", ");
}

/* Flatten into one entry per day per session */
const SLOTS = [];
SCHEDULE.classes.forEach(c => {
  c.sessions.forEach(s => {
    s.days.forEach(d => {
      SLOTS.push({ day:d, start:s.start, end:s.end, name:c.name, with:c.with, sub:c.sub, note:c.note, tba:c.tba, brand:c.brand });
    });
  });
});
SLOTS.sort((a,b) => mins(a.start) - mins(b.start));

/* Studio-local time, whichever timezone the visitor is in */
function studioNow(){
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone:"Asia/Kolkata", weekday:"short", hour:"2-digit", minute:"2-digit", hour12:false
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  return { day: get("weekday"), minutes: Number(get("hour"))*60 + Number(get("minute")) };
}

let state = { day: "all", view: "classes" };
const el = id => document.getElementById(id);

/* ── Live strip ─────────────────────────────────────────────────── */
function renderLive(){
  const now = studioNow();
  const box = el("live"), label = el("liveLabel"), body = el("liveBody");
  const today = SLOTS.filter(s => s.day === now.day);

  const on = today.find(s => now.minutes >= mins(s.start) && now.minutes < mins(s.end));
  const next = today.find(s => mins(s.start) > now.minutes);

  box.hidden = false;
  box.classList.remove("quiet");

  if (on){
    label.textContent = "On the floor now";
    body.innerHTML = `<strong>${on.name}</strong> · until ${fmt(on.end)}`;
  } else if (next){
    label.textContent = "Up next today";
    body.innerHTML = `<strong>${next.name}</strong> · ${range(next.start, next.end)}`;
  } else {
    box.classList.add("quiet");
    label.textContent = "Studio quiet";
    body.innerHTML = `Nothing more today — <strong>doors open again tomorrow</strong>`;
  }
}

/* ── Day chips ──────────────────────────────────────────────────── */
function renderChips(){
  const today = studioNow().day;
  const box = el("chips");
  box.innerHTML = "";
  [{k:"all", t:"All days"}, ...DAYS.map(d => ({k:d, t:d}))].forEach(o => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (o.k === today ? " is-today" : "");
    b.textContent = o.t;
    b.setAttribute("aria-pressed", String(state.day === o.k));
    if (o.k === today) b.title = "Today";
    b.onclick = () => { state.day = o.k; render(); };
    box.appendChild(b);
  });
}

/* ── Views ──────────────────────────────────────────────────────── */
function renderDays(){
  const now = studioNow();
  const days = state.day === "all" ? DAYS : [state.day];
  const grid = document.createElement("div");
  grid.className = "grid";
  if (days.length === 1) grid.style.gridTemplateColumns = "1fr";

  days.forEach(d => {
    const slots = SLOTS.filter(s => s.day === d);
    const col = document.createElement("div");
    col.className = "col" + (d === now.day ? " today" : "");

    const head = document.createElement("div");
    head.className = "col-head";
    const emptyLabel = (d === "Sat" || d === "Sun") ? "Workshops only" : "No classes";
    head.innerHTML =
      `<div class="col-day">${FULL[d]}</div>
       <div class="col-count">${slots.length ? slots.length + (slots.length > 1 ? " classes" : " class") : emptyLabel}${d === now.day ? " · Today" : ""}</div>`;
    col.appendChild(head);

    if (!slots.length){
      const e = document.createElement("div");
      e.className = "col-empty" + (d === "Sat" || d === "Sun" ? " col-empty-weekend" : "");
      e.textContent = (d === "Sat" || d === "Sun")
        ? "Weekends are for workshops!"
        : "No regular classes.";
      col.appendChild(e);
    }

    slots.forEach(s => {
      const live = d === now.day && now.minutes >= mins(s.start) && now.minutes < mins(s.end);
      const div = document.createElement("div");
      div.className = "slot" + (live ? " now" : "") + (s.tba ? " tba" : "");
      div.innerHTML =
        `<div class="slot-time">${range(s.start, s.end)}</div>
         ${s.brand ? `<div class="slot-brand">${s.brand}</div>` : ""}
         <div class="slot-name">${s.name}</div>
         ${s.with ? `<div class="slot-with">with ${s.with}</div>` : ""}
         ${s.sub ? `<div class="slot-with">${s.sub}</div>` : ""}
         ${s.note ? `<div class="slot-note">${s.note}</div>` : ""}`;
      col.appendChild(div);
    });

    grid.appendChild(col);
  });
  return grid;
}

function renderClasses(){
  const now = studioNow();
  const list = document.createElement("div");
  list.className = "list";

  const visible = SCHEDULE.classes
    .map(c => ({
      ...c,
      sessions: state.day === "all" ? c.sessions : c.sessions.filter(s => s.days.includes(state.day))
    }))
    .filter(c => c.sessions.length)
    .sort(byWeek);

  const buildCard = c => {
    const card = document.createElement("article");
    card.className = "card" + (c.tba ? " tba" : "");

    const runs = c.sessions.map(s => {
      const days = [...s.days].sort((x,y) => DAYS.indexOf(x) - DAYS.indexOf(y));
      const pills = days.map(d => {
        const live = d === now.day && now.minutes >= mins(s.start) && now.minutes < mins(s.end);
        const isToday = d === now.day;
        return `<span class="pill${isToday ? " pill-today" : ""}${live ? " pill-now" : ""}">${d}</span>`;
      }).join("");
      return `<div class="run">
                <div class="run-time">${range(s.start, s.end)}</div>
                <div class="run-days">${pills}</div>
              </div>`;
    }).join("");

    const igLink = h => `<a class="event-ig" href="https://instagram.com/${h}" target="_blank" rel="noopener">@${h}</a>`;
    const brandBit = c.brand
      ? `<div class="event-brand">${c.brand}${c.handle ? ` <a class="brand-ig" href="https://instagram.com/${c.handle}" target="_blank" rel="noopener">@${c.handle}</a>` : ""}</div>`
      : "";
    const withBit = c.with
      ? `<div class="card-with">with ${c.with}${(!c.brand && c.handle) ? " " + igLink(c.handle) : ""}</div>`
      : (!c.brand && c.handle ? `<div class="card-with">${igLink(c.handle)}</div>` : "");

    card.innerHTML =
      `<div class="card-main">
         ${brandBit}
         <h3 class="card-name">${c.name}</h3>
         ${withBit}
         ${c.sub ? `<div class="card-with">${c.sub}</div>` : ""}
         ${c.note ? `<div class="slot-note">${c.note}</div>` : ""}
       </div>
       <div class="card-runs">${runs}</div>`;
    return card;
  };

  // Split the day at noon — how anyone actually picks a class
  const morning = visible.filter(c => firstStart(c) < 12*60);
  const evening = visible.filter(c => firstStart(c) >= 12*60);

  const section = (title, items) => {
    if (!items.length) return;
    const h = document.createElement("h2");
    h.className = "section-head";
    h.innerHTML = `${title} <span>${items.length}</span>`;
    list.appendChild(h);
    items.forEach(c => list.appendChild(buildCard(c)));
  };

  section("Mornings", morning);
  section("Evenings", evening);

  return list;
}

function render(){
  renderChips();
  el("viewDays").setAttribute("aria-pressed", String(state.view === "days"));
  el("viewClasses").setAttribute("aria-pressed", String(state.view === "classes"));

  const board = el("board");
  board.innerHTML = "";

  const any = SLOTS.some(s => state.day === "all" || s.day === state.day);
  if (!any){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = (state.day === "Sat" || state.day === "Sun")
      ? "Weekends are for workshops! No regular classes on " + FULL[state.day] + " — check the dates below."
      : `No classes on ${FULL[state.day]} this month. Pick another day.`;
    board.appendChild(e);
    return;
  }
  board.appendChild(state.view === "days" ? renderDays() : renderClasses());
}

/* ── One-off dated events ───────────────────────────────────────── */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEKDAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* Today in the studio's timezone, as YYYY-MM-DD */
function studioDate(){
  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone:"Asia/Kolkata", year:"numeric", month:"2-digit", day:"2-digit"
  }).format(new Date());
  return p;
}

/* Rough start-time of an event, for ordering two things on the same day.
   Reads the first clock time in the free-text time field:
   "3–4:30pm" → 15:00,  "11am–12:30pm" → 11:00,  "7pm onwards" → 19:00 */
function eventMins(ev){
  if (!ev.time) return -1;                       // untimed items sit first
  const t = ev.time.toLowerCase();
  const num = t.match(/(\d{1,2})(?::(\d{2}))?/);
  if (!num) return -1;
  let h = Number(num[1]);
  const mm = Number(num[2] || 0);
  const after = t.slice(num.index + num[0].length);
  const mer = (after.match(/am|pm/) || t.match(/am|pm/) || [])[0];
  if (mer === "pm" && h < 12) h += 12;
  if (mer === "am" && h === 12) h = 0;
  return h*60 + mm;
}

function renderEvents(){
  const list = SCHEDULE.events || [];
  const box = el("events");
  if (!list.length){ box.hidden = true; return; }
  box.hidden = false;

  el("eventsMonth").textContent = "· " + SCHEDULE.month;
  const today = studioDate();

  const wrap = el("eventsList");
  wrap.innerHTML = "";

  [...list]
    .sort((a,b) => a.date.localeCompare(b.date) || (eventMins(a) - eventMins(b)))
    .forEach(ev => {
    const [y,m,d] = ev.date.split("-").map(Number);
    const wd = WEEKDAY[new Date(Date.UTC(y, m-1, d)).getUTCDay()];
    const isToday = ev.date === today;
    const isPast  = ev.date < today;

    const row = document.createElement("article");
    row.className = "event"
      + (ev.flag && !isPast ? " flag" : "")
      + (isPast ? " past" : "")
      + (isToday ? " today" : "");

    row.innerHTML =
      `<div class="event-date">
         <span class="event-day">${d}</span>
         <span class="event-mon">${MONTHS[m-1]}</span>
         <span class="event-wd">${wd}</span>
       </div>
       <div>
         ${ev.brand ? `<div class="event-brand">${ev.brand}${ev.handle && !ev.with ? ` <a class="brand-ig" href="https://instagram.com/${ev.handle}" target="_blank" rel="noopener">@${ev.handle}</a>` : ""}</div>` : ""}
         <h3 class="event-name">${ev.name}</h3>
         ${ev.time ? `<div class="event-time">${ev.time}</div>` : ""}
         ${ev.with ? `<div class="event-sub">with ${ev.with}${
             ev.handle
               ? ` <a class="event-ig" href="https://instagram.com/${ev.handle}" target="_blank" rel="noopener">@${ev.handle}</a>`
               : ""}</div>` : ""}
         ${ev.sub ? `<div class="event-sub">${ev.sub}</div>` : ""}
         <div class="event-tags">
           ${ev.note ? `<span class="slot-note">${ev.note}</span>` : ""}
           ${isToday ? `<span class="tag-today">Today</span>` : ""}
         </div>
       </div>`;
    wrap.appendChild(row);
  });
}

/* ── Static bits ────────────────────────────────────────────────── */
function renderStatic(){
  el("month").textContent = SCHEDULE.month;
  el("updated").textContent = "Schedule updated " + SCHEDULE.updated;
  document.title = `Class Schedule ${SCHEDULE.month} — Analog House, Vashi`;

  const phoneIcon =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>`;

  el("calls").innerHTML = SCHEDULE.phones.map(p =>
    `<a class="call" href="tel:${p.replace(/\s/g,"")}">${phoneIcon}<span>${p}</span></a>`).join("");

  el("addressbar").innerHTML =
    `<a href="${SCHEDULE.mapUrl}" target="_blank" rel="noopener">${SCHEDULE.address}</a>`;
}

renderStatic();

el("viewDays").addEventListener("click", () => { state.view = "days"; render(); });
el("viewClasses").addEventListener("click", () => { state.view = "classes"; render(); });

renderLive();
render();
renderEvents();
setInterval(() => { renderLive(); render(); renderEvents(); }, 60000);
</script>
